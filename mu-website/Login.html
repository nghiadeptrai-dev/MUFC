<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIT FC — Đăng nhập</title>
  <link rel="stylesheet" href="css/Management/Login.css" />
  <!-- Tabler Icons (outline) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>
<body>

<div class="login-page">
  <div class="login-wrap">

    <!-- ── HEADER ── -->
    <div class="login-header">
      <svg class="login-shield" viewBox="0 0 46 52" fill="none">
        <path d="M23 1.5L3 9v15c0 12 8 22 20 25.5C35 46 43 36 43 24V9L23 1.5Z"
              fill="rgba(255,255,255,.1)" stroke="#FBE122" stroke-width="1.4"/>
        <path d="M23 7L7 13.5V26c0 9 6 17 16 19.5 10-2.5 16-10.5 16-19.5V13.5L23 7Z"
              fill="rgba(218,41,28,.55)"/>
        <text x="23" y="30" text-anchor="middle"
              font-family="Oswald,sans-serif" font-size="12" font-weight="700"
              fill="#FBE122" letter-spacing="1">BIT</text>
        <text x="23" y="39" text-anchor="middle"
              font-family="Barlow Condensed,sans-serif" font-size="7" font-weight="600"
              fill="rgba(251,225,34,.7)" letter-spacing="2">FC</text>
      </svg>
      <div class="login-hdr-text">
        <div class="login-hdr-title">BIT FC Portal</div>
        <div class="login-hdr-sub">Member Access System</div>
      </div>
    </div>

    <!-- ── CARD ── -->
    <div class="login-card">
      <div class="login-body">

        <!-- Error banner -->
        <div class="login-error" id="error-banner"></div>

        <!-- Email -->
        <div class="login-field">
          <label class="login-label" for="input-email">Email</label>
          <div class="login-input-row">
            <input
              class="login-input"
              type="email"
              id="input-email"
              placeholder="email@bit.edu.vn"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="login-field">
          <label class="login-label" for="input-password">Mật khẩu</label>
          <div class="login-input-row">
            <input
              class="login-input has-eye"
              type="password"
              id="input-password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button class="eye-btn" id="eye-toggle" type="button" aria-label="Hiện/ẩn mật khẩu">
              <i class="ti ti-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Remember me + Forgot -->
        <div class="login-extras">
          <div class="chk-wrap" id="remember-wrap">
            <div class="chk-box" id="chk-box"></div>
            <span class="chk-lbl">Ghi nhớ đăng nhập</span>
          </div>
          <a href="#" class="forgot-link" id="forgot-btn">Quên mật khẩu?</a>
        </div>

        <!-- Submit -->
        <button class="login-btn" id="login-btn" type="button">
          Vào sân &nbsp;→
        </button>

        <!-- OR -->
        <div class="or-row">
          <div class="or-line"></div>
          <span class="or-txt">hoặc</span>
          <div class="or-line"></div>
        </div>

        <!-- Social -->
        <div class="social-row">
          <button class="soc-btn" id="google-btn" type="button">
            <!-- Google G icon -->
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button class="soc-btn" id="facebook-btn" type="button">
            <!-- Facebook icon -->
            <svg viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.514c-1.491 0-1.956.93-1.956 1.883v2.27h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
            </svg>
            Facebook
          </button>
        </div>

        <!-- Footer -->
        <div class="login-footer">BIT Football Club &nbsp;·&nbsp; Members Only</div>
      </div>
    </div>

  </div>
</div>

<!-- Firebase SDK (ESM via CDN) + Login logic -->
<script type="module" src="js/Management/Login.js"></script>

</body>
</html>
